name: Generate PlantUML diagrams

on:
  push:
    branches:
      - main

jobs:
  generate-diagrams:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Generate PlantUML diagrams (Maven)
        working-directory: MtdrSpring/backend
        run: |
          mvn -B clean package -DskipTests
          # or run a specific plugin goal if configured, e.g.:
          # mvn -B plantuml-generator:generate

      - name: Commit generated diagrams
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "chore(diagrams): update generated PlantUML diagrams"
          file_pattern: architecture/docs/diagrams/**